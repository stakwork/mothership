name: Checks

# Guards every change:
#   - go: build + vet + unit tests for the plugin packages (auth,
#     adminapi, hooks, …). The root package is a Go plugin (no main
#     func; -buildmode=plugin, CGO, pinned Bifrost checkout), so the
#     plugin binary itself is only built by the Dockerfile — a plain
#     `go build .` fails by design. ./internal/... and ./auth/... are the
#     compile surface that matters for review.
#   - modules: build + vet + unit tests for the image's two standalone Go
#     modules: wrapper (the container entrypoint, stdlib only) and
#     logarchive (its S3 helper for log offload).
#   - tygo-check: regenerates ui/src/api/types.ts from the Go structs
#     in internal/adminapi and fails on any diff, so a Go response-shape
#     change can't land without its committed TS counterpart (drift would
#     silently break the dashboard's typed fetch layer).
#   - ui: type-checks (tsc -b) and bundles the SPA, catching imports
#     the regenerated types.ts no longer satisfies.
#   - auth-ts: type-checks and tests gatekey (auth/ts) against the
#     fixtures it shares with the Go verifier.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./internal/... ./auth/...

      - name: Vet
        run: go vet ./internal/... ./auth/...

      - name: Test
        run: go test ./internal/... ./auth/...

  # The wrapper (container entrypoint, stdlib only) and logarchive (its S3
  # helper) are their own modules, so the plugin job never reaches them.
  # Static build as in the Dockerfile's builder stages, then vet + tests
  # (race on: the wrapper stops and restarts child processes, the helper
  # streams through a pipe).
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: [wrapper, logarchive]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*

      - name: Build (static, as in the image)
        run: CGO_ENABLED=0 go build -o /dev/null .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  tygo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pinned so the generated output is byte-stable — a tygo release
      # changing its formatting would otherwise fail every PR. Bump in
      # lockstep with the version noted in Makefile and tygo.yaml.
      - name: Install tygo
        run: go install github.com/gzuidhof/tygo@v0.2.21

      - name: Check generated TS types are up to date
        run: make tygo-check

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/adminapi/ui/package-lock.json

      - name: Install SPA dependencies
        run: make ui-install

      - name: Type-check and build SPA
        run: make ui-build

  # gatekey (the TS macaroon signer/verifier, published to npm) shares
  # auth/fixtures/*.json with the Go verifier byte for byte: Go produces
  # the tlog fixtures, TS produces the macaroon ones. Running both here
  # keeps either side from drifting. No lockfile: it installs as a
  # library would.
  auth-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth/ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
